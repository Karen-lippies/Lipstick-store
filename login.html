<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up — Luxe Beauty</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="logo">
                <i class="fas fa-lipstick"></i> LUXE BEAUTY
            </a>

            <!-- ===== LOGIN FORM ===== -->
            <div id="loginSection">
                <h2>Welcome Back</h2>
                <div class="auth-message" id="loginMessage"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
                </form>
                <p class="auth-footer">
                    Don't have an account? <a href="#" id="showSignup">Sign Up</a>
                </p>
                <p class="auth-footer">
                    <a href="admin.html">Admin Login</a>
                </p>
            </div>

            <!-- ===== SIGNUP FORM ===== -->
            <div id="signupSection" style="display:none;">
                <h2>Create Account</h2>
                <div class="auth-message" id="signupMessage"></div>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPhone">Mobile Number</label>
                        <input type="tel" id="signupPhone" placeholder="+1 234 567 8900" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create Account</button>
                </form>
                <p class="auth-footer">
                    Already have an account? <a href="#" id="showLogin">Log In</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-auth.js"></script>

    <script>
        // ============================================================
        // LOGIN / SIGNUP PAGE LOGIC
        // ============================================================

        // Toggle between login and signup forms
        document.getElementById('showSignup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('signupSection').style.display = 'block';
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        });

        // --- Handle Login ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMessage');

            btn.textContent = 'Logging in...';
            btn.disabled = true;
            msg.style.display = 'none';

            const result = await Auth.login(email, password);

            if (result.success) {
                // Check if admin
                const isAdmin = await Auth.checkAdmin(result.user.id);
                if (isAdmin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                msg.textContent = formatError(result.error);
                msg.className = 'auth-message error';
                btn.textContent = 'Log In';
                btn.disabled = false;
            }
        });

        // --- Handle Signup ---
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupBtn');
            const msg = document.getElementById('signupMessage');

            btn.textContent = 'Creating account...';
            btn.disabled = true;
            msg.style.display = 'none';

            const result = await Auth.signup(name, email, phone, password);

            if (result.success) {
                msg.textContent = 'Account created! Redirecting...';
                msg.className = 'auth-message success';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                msg.textContent = formatError(result.error);
                msg.className = 'auth-message error';
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });

        // --- Format Supabase error messages to be beginner-friendly ---
        function formatError(error) {
            const e = error.toLowerCase();
            if (e.includes('invalid login credentials')) return 'Incorrect email or password. Please try again.';
            if (e.includes('user already registered') || e.includes('already registered')) return 'This email is already registered. Try logging in.';
            if (e.includes('password should be at least 6 characters')) return 'Password must be at least 6 characters.';
            if (e.includes('email is not allowed')) return 'Please use a valid email address.';
            return error;
        }

        // If already logged in, redirect to home
        Auth.init().then(user => {
            if (user) window.location.href = 'index.html';
        });
    </script>
</body>
</html>
