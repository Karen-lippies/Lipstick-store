<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag — Luxe Beauty</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo"><i class="fas fa-lipstick"></i> LUXE BEAUTY</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tryon.html">Virtual Try-On</a></li>
                    <li><a href="index.html#products">Shop</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
                    <a href="login.html"><i class="fas fa-user"></i></a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== CART PAGE ========== -->
    <section class="cart-page">
        <div class="container">
            <h1>Your Bag</h1>

            <!-- Loading state -->
            <div class="loading-page" id="loadingState"><div class="spinner"></div> Loading...</div>

            <!-- Empty cart message -->
            <div class="empty-cart-msg" id="emptyCart" style="display:none;">
                <i class="fas fa-shopping-bag"></i>
                <p>Your bag is empty</p>
                <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Start Shopping</a>
            </div>

            <!-- Cart items + summary -->
            <div id="cartContent" style="display:none;">
                <div class="cart-items-list" id="cartItemsList"></div>
                <div class="cart-summary">
                    <div class="total-row">
                        <span>Total</span>
                        <span id="cartTotal">$0.00</span>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="proceedToCheckout()">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Luxe Beauty. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/supabase-products.js"></script>
    <script src="js/supabase-cart.js"></script>

    <script>
        // ============================================================
        // CART PAGE LOGIC
        // ============================================================

        let cartItems = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.requireAuth();
            if (!user) return;
            await loadCart(user.id);
        });

        async function loadCart(userId) {
            cartItems = await Cart.getItems(userId);

            document.getElementById('loadingState').style.display = 'none';

            if (cartItems.length === 0) {
                document.getElementById('emptyCart').style.display = 'block';
                return;
            }

            document.getElementById('cartContent').style.display = 'block';
            renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            const total = Cart.calculateTotal(cartItems);

            list.innerHTML = cartItems.map(item => {
                const icon = item.category === 'Lipstick' ? 'fa-lipstick'
                           : item.category === 'Eyeliner' ? 'fa-pen-nib' : 'fa-eye';

                return `
                    <div class="cart-item">
                        <div class="cart-item-image">
                            ${item.image_url
                                ? `<img src="${item.image_url}" alt="${item.name}">`
                                : `<div class="mini-placeholder" style="background-color:${item.shade_code}20;">
                                     <i class="fas ${icon}" style="color:${item.shade_code};"></i>
                                   </div>`
                            }
                        </div>
                        <div class="cart-item-details">
                            <h3>${item.name}</h3>
                            <p class="shade-text">Shade: ${item.shade_code} &middot; Qty: ${item.quantity}</p>
                        </div>
                        <div class="cart-item-actions">
                            <span class="item-price">\u20B9${(item.price * item.quantity).toFixed(0)}</span>
                            <button class="remove-btn" onclick="removeItem('${item.product_id}')">
                                <i class="fas fa-trash-alt"></i> Remove
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').textContent = `\u20B9${total.toFixed(0)}`;
        }

        async function removeItem(productId) {
            const user = Auth.currentUser;
            if (!user) return;

            await Cart.removeItem(user.id, productId);
            cartItems = cartItems.filter(i => i.product_id !== productId);

            if (cartItems.length === 0) {
                document.getElementById('cartContent').style.display = 'none';
                document.getElementById('emptyCart').style.display = 'block';
            } else {
                renderCartItems();
            }

            showToast('Item removed', 'success');
        }

        function proceedToCheckout() {
            window.location.href = 'checkout.html';
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
    </script>
</body>
</html>
