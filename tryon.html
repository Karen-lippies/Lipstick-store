<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On — Luxe Beauty</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo"><i class="fas fa-lipstick"></i> LUXE BEAUTY</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tryon.html">Virtual Try-On</a></li>
                    <li><a href="index.html#products">Shop</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
                    <a href="login.html"><i class="fas fa-user"></i></a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== TRY-ON PAGE ========== -->
    <section class="tryon-page">
        <div class="container">
            <h1>Virtual Makeup Try-On</h1>

            <div class="tryon-layout">
                <!-- LEFT: Camera + Video -->
                <div>
                    <div class="tryon-video-container">
                        <video id="tryOnVideo" playsinline></video>
                        <canvas id="tryOnCanvas"></canvas>
                        <div class="camera-placeholder" id="cameraPlaceholder">
                            <i class="fas fa-camera"></i>
                            <p>Click "Start Camera" to begin</p>
                        </div>
                    </div>
                    <div class="status-text" id="cameraStatus">Camera not started</div>
                </div>

                <!-- RIGHT: Controls -->
                <div class="tryon-controls">
                    <h3>Makeup Controls</h3>

                    <!-- Start Camera Button -->
                    <button class="btn btn-primary btn-block" id="startCamera" style="margin-bottom:20px;">
                        <i class="fas fa-video"></i> Start Camera
                    </button>

                    <!-- Mode Selection -->
                    <div class="mode-tabs">
                        <button class="mode-btn active" data-mode="lipstick">
                            <i class="fas fa-lipstick"></i> Lipstick
                        </button>
                        <button class="mode-btn" data-mode="eyeshadow">
                            <i class="fas fa-eye"></i> Eyeshadow
                        </button>
                        <button class="mode-btn" data-mode="eyeliner">
                            <i class="fas fa-pen-nib"></i> Eyeliner
                        </button>
                    </div>

                    <!-- Lipstick Shades -->
                    <div class="shade-panel active" id="lipstickPanel">
                        <h4>Choose Lipstick Shade</h4>
                        <div class="shade-grid" id="lipstickShades"></div>
                    </div>

                    <!-- Eyeshadow Shades -->
                    <div class="shade-panel" id="eyeshadowPanel">
                        <h4>Choose Eyeshadow Shade</h4>
                        <div class="shade-grid" id="eyeshadowShades"></div>
                    </div>

                    <!-- Eyeliner Shades -->
                    <div class="shade-panel" id="eyelinerPanel">
                        <h4>Choose Eyeliner Shade</h4>
                        <div class="shade-grid" id="eyelinerShades"></div>
                    </div>

                    <!-- Intensity Slider -->
                    <div class="control-group">
                        <label>Intensity</label>
                        <div class="slider-row">
                            <input type="range" id="intensitySlider" min="10" max="100" value="70">
                            <span class="slider-value" id="intensityValue">70%</span>
                        </div>
                    </div>

                    <!-- Thickness Slider (Eyeliner) -->
                    <div class="control-group" id="thicknessGroup">
                        <label>Line Thickness</label>
                        <div class="slider-row">
                            <input type="range" id="thicknessSlider" min="1" max="8" value="3">
                            <span class="slider-value" id="thicknessValue">3px</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="tryon-actions">
                        <button class="btn btn-outline btn-sm" id="resetBtn">
                            <i class="fas fa-undo"></i> Reset
                        </button>
                        <button class="btn btn-accent btn-sm" id="snapshotBtn">
                            <i class="fas fa-camera"></i> Snapshot
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Luxe Beauty. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <!-- Supabase (free): for loading shades from the products table -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App modules -->
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-products.js"></script>
    <script src="js/tryon.js"></script>

    <!-- MediaPipe Face Mesh (runs 100% in the browser, free) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        // Initialize try-on when page loads
        document.addEventListener('DOMContentLoaded', () => {
            TryOn.init();
        });

        // Hide camera placeholder when camera starts
        document.getElementById('startCamera')?.addEventListener('click', () => {
            setTimeout(() => {
                const placeholder = document.getElementById('cameraPlaceholder');
                if (placeholder) placeholder.style.display = 'none';
            }, 1500);
        });
    </script>
</body>
</html>
