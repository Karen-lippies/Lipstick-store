<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — Karen</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo"><i class="fas fa-lipstick"></i> KAREN</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tryon.html">Virtual Try-On</a></li>
                    <li><a href="index.html#products">Shop</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
                    <a href="login.html"><i class="fas fa-user"></i></a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== PRODUCT DETAIL ========== -->
    <section class="product-detail">
        <div class="container">
            <div class="loading-page" id="loadingState"><div class="spinner"></div> Loading product...</div>

            <div class="product-detail-grid" id="productContent" style="display:none;">
                <div class="product-detail-image" id="productImage">
                    <!-- Image or placeholder loaded by JS -->
                </div>
                <div class="product-detail-info">
                    <h1 id="productName"></h1>
                    <p class="shade-label" id="productShade"></p>
                    <p class="detail-price" id="productPrice"></p>
                    <p id="productCategory" style="margin-bottom:20px;"></p>

                    <div class="qty-row">
                        <label>Quantity:</label>
                        <div class="qty-control">
                            <button onclick="changeQty(-1)">−</button>
                            <input type="number" id="qtyInput" value="1" min="1" max="10">
                            <button onclick="changeQty(1)">+</button>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block" id="addToCartBtn" onclick="addToCartDetail()">
                        Add to Bag
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Karen. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/supabase-products.js"></script>
    <script src="js/supabase-cart.js"></script>

    <script>
        // ============================================================
        // PRODUCT DETAIL PAGE LOGIC
        // ============================================================

        let productData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.init();

            // Get product ID from URL
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            productData = await Products.getById(productId);

            if (!productData) {
                document.getElementById('loadingState').innerHTML = 'Product not found.';
                return;
            }

            // Display the product
            const icon = productData.category === 'Lipstick' ? 'fa-lipstick'
                       : productData.category === 'Eyeliner' ? 'fa-pen-nib' : 'fa-eye';

            document.getElementById('productImage').innerHTML = productData.image_url
                ? `<img src="${productData.image_url}" alt="${productData.name}">`
                : `<div class="placeholder-img" style="background: linear-gradient(135deg, ${productData.shade_code}30 0%, ${productData.shade_code}10 100%); width:100%; height:100%;">
                     <i class="fas ${icon}" style="font-size:5rem; color:${productData.shade_code}; opacity:0.6;"></i>
                   </div>`;

            document.getElementById('productName').textContent = productData.name;
            document.getElementById('productShade').textContent = `Shade: ${productData.shade_code}`;
            if (productData.is_on_sale && productData.original_price) {
                document.getElementById('productPrice').innerHTML = `<span style="text-decoration:line-through;color:var(--text-muted);font-size:1rem;margin-right:8px;">\u20B9${productData.original_price}</span> \u20B9${productData.price} <span style="background:#e74c6f;color:#fff;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;margin-left:8px;">${productData.discount_percent}% OFF</span>`;
            } else {
                document.getElementById('productPrice').textContent = `\u20B9${Number(productData.price).toFixed(0)}`;
            }
            document.getElementById('productCategory').textContent = `Category: ${productData.category}`;
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('productContent').style.display = 'grid';
        });

        function changeQty(delta) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 10) val = 10;
            input.value = val;
        }

        async function addToCartDetail() {
            const user = Auth.currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            if (!productData) return;

            const qty = parseInt(document.getElementById('qtyInput').value);

            await Cart.addItem(user.id, {
                productId: productData.id,
                name: productData.name,
                price: productData.price,
                shadeCode: productData.shade_code,
                category: productData.category,
                imageUrl: productData.image_url || '',
                quantity: qty
            });

            showToast('Added to bag!', 'success');
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
    </script>
</body>
</html>
